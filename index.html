 let s=db.m[0].id;const d=()=>{D.innerHTML='<h2>Siapa yang masuk?</h2><div class="chips">'+db.m.map(m=>'<button class="chip'+(m.id==s?' on':'')+'" data-m="'+m.id+'">'+E(m.n)+'</button>').join('')+'</div><input id="lp" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"><div id="le" class="neg"></div><button class="btn" id="lb">Buka</button>';D.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{s=+b.dataset.m;d()});const go=()=>{const m=db.m.find(x=>x.id==s);if(hp($('#lp').value)==m.pin){me=m;tab='home';D.hidden=true;render()}else $('#le').textContent='PIN salah. Coba lagi.'};$('#lb').onclick=go;$('#lp').onkeydown=e=>{if(e.key=='Enter')go()}};d()}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0)addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
save();login();
</script></body></html>
